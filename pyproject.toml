[project]
name = "slides2vid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "gtts>=2.5.4",
    "lxml>=6.0.2",
    "pdf2image>=1.17.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "returns>=0.26.0",
    "tqdm>=4.67.1",
    "yamlable>=1.1.1",
    "ml-dtypes>=0.5",
    "chatterbox-tts>=0.1.3",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
plugins = ["returns.contrib.mypy.returns_plugin"]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy>=1.25"]


[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
